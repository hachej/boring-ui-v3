name: verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --ignore-scripts
      - run: npx playwright-core install --with-deps chromium
      - run: npm run setup:formal
      - run: npm run check
      - run: node bin/boring.mjs registry check
      - name: install every registry item into the example through shadcn add; the committed copies must be what the registry installs (shadcn's own primitives under ui/ track upstream)
        run: node bin/boring.mjs registry install && git diff --exit-code -- examples/registry-host ':!examples/registry-host/src/components/ui'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:formal
      - run: npm run smoke
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: .cache/evidence/
          if-no-files-found: ignore
